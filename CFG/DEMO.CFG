set nglog_ngstats_exec 0
set nglog_ngstats_browser 0

set cl_gun 1
//set fov 90
set con_notifytime 8

//bindings
//bind f1 gun
//bind f2 
bind f3 cross
bind f4 hands
bind f5 mute
bind f6 "vdn;play world/force3"
bind f7 "vup;play world/force2"
bind f12 screenshot

//Volume
alias vup volume_1;alias vdn volume_0
alias volume_0 "cleared;set s_volume 0 ;set vu 1 ;set vd w ; alias vup volume_1; alias vdn volume_0;echo VOL |---------- 0"
alias volume_1 "cleared;set s_volume 0.1 ;set vu 2 ;set vd 0 ; alias vup volume_2; alias vdn volume_0;echo VOL -|--------- 1"
alias volume_2 "cleared;set s_volume 0.2 ;set vu 3 ;set vd 1 ; alias vup volume_3; alias vdn volume_1;echo VOL --|-------- 2"
alias volume_3 "cleared;set s_volume 0.3 ;set vu 4 ;set vd 2 ; alias vup volume_4; alias vdn volume_2;echo VOL ---|------- 3"
alias volume_4 "cleared;set s_volume 0.4 ;set vu 5 ;set vd 3 ; alias vup volume_5; alias vdn volume_3;echo VOL ----|------ 4"
alias volume_5 "cleared;set s_volume 0.5 ;set vu 6 ;set vd 4 ; alias vup volume_6; alias vdn volume_4;echo VOL -----|----- 5"
alias volume_6 "cleared;set s_volume 0.6 ;set vu 7 ;set vd 5 ; alias vup volume_7; alias vdn volume_5;echo VOL ------|---- 6"
alias volume_7 "cleared;set s_volume 0.7 ;set vu 8 ;set vd 6 ; alias vup volume_8; alias vdn volume_6;echo VOL -------|--- 7"
alias volume_8 "cleared;set s_volume 0.8 ;set vu 9 ;set vd 7 ; alias vup volume_9; alias vdn volume_7;echo VOL --------|-- 8"
alias volume_9 "cleared;set s_volume 0.9 ;set vu 10 ;set vd 8 ; alias vup volume_10;alias vdn volume_8;echo VOL ---------|- 9"
alias volume_10 "cleared;set s_volume 1 ;set vu w ;set vd 9 ; alias vup volume_10;alias vdn volume_9;echo VOL ----------| 10"
alias cleared "echo;echo;echo"

// Crosshair
alias cross "crosshair 2;bind f3 cross1"
alias cross1 "crosshair 3;bind f3 cross2"
alias cross2 "crosshair 1;bind f3 cross3"
alias cross3 "crosshair 0;bind f3 cross"

//hands
alias hands "hand 0;bind f4 hands1"
alias hands1 "hand 2;bind f4 hands"

exec cfg/demos_edl99.cfg

//play cfg/demo

