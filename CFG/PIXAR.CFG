set ngWorldStats_password pix

sw_mipscale 1.5
//bind pgdown "join pixar team"
alias +quitz "say to nara...;wait"
alias -quitz "quit"
bind PAUSE +quitz

bind k "kill"
fov 90
//maps
bind F7 "maps"

alias q2dm1 "map q2dm1"
bind kp_plus "gamma"
alias gamma "echo Gamma 0.7;vid_gamma 0.65;bind kp_plus gamma1"
alias gamma1 "echo Gamma 0.65;vid_gamma 0.6;bind kp_plus gamma2"
alias gamma2 "echo Gamma 0.6;vid_gamma 0.55;bind kp_plus gamma3"
alias gamma3 "echo Gamma 0.55;vid_gamma 0.5;bind kp_plus gamma4"
alias gamma4 "echo Gamma 0.5;vid_gamma 0.45;bind kp_plus gamma5"
alias gamma5 "echo Gamma 0.75;vid_gamma 0.4;bind kp_plus gamma"
//Volume
bind kp_enter "vup;play world/fusein"
bind kp_pgdn "vdn;play world/fuseout"
alias vup volume_1
alias vdn volume_0
alias volume_0 "clear;set s_volume 0 ;set vu 1 ;set vd w ; alias vup volume_1; alias vdn volume_0;echo VOL |---------- 0"
alias volume_1 "clear;set s_volume 0.1 ;set vu 2 ;set vd 0 ; alias vup volume_2; alias vdn volume_0;echo VOL -|--------- 1"
alias volume_2 "clear;set s_volume 0.2 ;set vu 3 ;set vd 1 ; alias vup volume_3; alias vdn volume_1;echo VOL --|-------- 2"
alias volume_3 "clear;set s_volume 0.3 ;set vu 4 ;set vd 2 ; alias vup volume_4; alias vdn volume_2;echo VOL ---|------- 3"
alias volume_4 "clear;set s_volume 0.4 ;set vu 5 ;set vd 3 ; alias vup volume_5; alias vdn volume_3;echo VOL ----|------ 4"
alias volume_5 "clear;set s_volume 0.5 ;set vu 6 ;set vd 4 ; alias vup volume_6; alias vdn volume_4;echo VOL -----|----- 5"
alias volume_6 "clear;set s_volume 0.6 ;set vu 7 ;set vd 5 ; alias vup volume_7; alias vdn volume_5;echo VOL ------|---- 6"
alias volume_7 "clear;set s_volume 0.7 ;set vu 8 ;set vd 6 ; alias vup volume_8; alias vdn volume_6;echo VOL -------|--- 7"
alias volume_8 "clear;set s_volume 0.8 ;set vu 9 ;set vd 7 ; alias vup volume_9; alias vdn volume_7;echo VOL --------|-- 8"
alias volume_9 "clear;set s_volume 0.9 ;set vu 10 ;set vd 8 ; alias vup volume_10;alias vdn volume_8;echo VOL ---------|- 9"
alias volume_10 "clear;set s_volume 1 ;set vu w ;set vd 9 ; alias vup volume_10;alias vdn volume_9;echo VOL ----------| 10"

//sound kHz
bind kp_minus "sound"
alias sound "s_khz 22;snd_restart;bind kp_minus sound1"
alias sound1 "s_khz 11;snd_restart;bind kp_minus sound"

//bind ' "exec duel.cfg"

//Config
//menu
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"
bind END "menu"
bind UPARROW "invprev"
bind DOWNARROW "invnext"
bind LEFTARROW "invdrop"
bind RIGHTARROW "invuse"

//move
bind SPACE "+movedown"
bind w "+moveup"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind c "+speed"
bind MOUSE1 "+attack"
bind MOUSE2 "+forward"
bind MOUSE3 "+zoom"
alias +zoom "sens1;fov 40;use railgun"
alias -zoom "sens;fov 90"

//guns
bind ALT "pich;use bfg;use railgun"
bind CTRL "pich;use grenades;use Grenade Launcher"
bind SHIFT "pich;use Rocket Launcher"
bind e "pich1;use Machinegun;use Chaingun"
bind t "pich;use grapple"
bind f "pich1;bestgun"
bind q "pich1;use shotgun;use Super Shotgun;use HyperBlaster"
alias bestgun "use shotgun;use Machinegun;use HyperBlaster;use Super Shotgun;use Chaingun;use Rocket Launcher;use Railgun"
alias pich "m_pitch 0.017"
alias pich1 "m_pitch 0.015"
pich
//Wave's
bind v "wave 0"
bind b "wave 1"
bind n "wave 2"
bind m "wave 3"
bind , "wave 4"
bind F8 "exec cfg/demo.cfg"

//observer
bind PGDN "join PiX"
bind PGUP "chasecam"
bind home "observer"
hand 2
sw_stipplealpha 1
sw_mode 0
//mouse
lookstrafe 0
lookspring 0

//defauld
set cl_maxfps 120
set rate 100000
scr_showturtle 1
sw_waterwarp 0
m_filter 1
scr_conspeed 62700
con_notifytime 6

alias sens "sensitivity 7.9"
alias sens1 "sensitivity 4"
sens
crosshair 2

//Galka
bind mwheeldown "invprev"
bind mwheelup "invnext"
//bind u "echo say Soft Rendgening (266MHz);say Sensitivity 17"

//wait
alias lwt "wait;wait;wait;wait;wait;wait" 
alias llwt "lwt;lwt;lwt;lwt;lwt;lwt;lwt;lwt;lwt"

name PiXaR

//skins
alias skin1 "echo skin Female;skin female/ctf_b;bind h skin2"
alias skin2 "echo skin Male;skin male/sniper;bind h skin1"
skin2

//TimeRefresh
bind "/" "timerefresh;lwt;toggleconsole;llwt;llwt;toggleconsole"

//ready
bind F12 "say I'm ready.;Ready"
bind f11 "connect 192.168.200.1"

//ScreeenShot
bind ";" "screenshot"

//scores
bind TAB "cmd help"
bind BACKSPACE "accuracy"
bind * time

//--Downloads--
set allow_download 1
set allow_download_maps 1
set allow_downloads_models 1
set allow_downloads_players 1
set allow_download_sounds 1

//exec
bind kp_end "exec cfg/maly.cfg"
bind kp_leftarrow "exec cfg/dyzio.cfg"
bind kp_home "exec cfg/skwara.cfg"

exec cfg/Record.cfg
exec cfg/s_says.cfg
exec cfg/vid_softFPS.cfg
bind r "say GL"

play cfg/pixar