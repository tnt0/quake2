//Match
alias 1menu0 "Echo [i'm at:] <1>RL <2>RG <3>MH <4>GA <5>SS <6>xx; 1menu0bind"
alias 1menu0bind "bind 1 11; bind 2 21; bind 3 31; bind 4 41; bind 5 51; bind 6 anuluj"
alias 11 "say_team I'm at RL; cancel"
alias 21 "say_team I'm at RG; cancel"
alias 31 "say_team I'm at MH; cancel"
alias 41 "say_team I'm at GA; cancel"
alias 51 "say_team I'm at SS; cancel"

alias 2menu0 "Echo [help at:] <1>RL <2>RG <3>MH <4>GA <5>SS <6>xx; 2menu0bind"
alias 2menu0bind "bind 1 12; bind 2 22; bind 3 32; bind 4 42;bind 5 52; bind 6 anuluj"
alias 12 "say_team Help at RL; cancel"
alias 22 "say_team Help at Rail; cancel"
alias 32 "say_team Help at MH; cancel"
alias 42 "say_team Help at GA; cancel"
alias 52 "say_team Help at SS; cancel"

alias 3menu0 "Echo [QUAD] <1>Mam QUADA !! <2>RL needed <3>Health needed <6>xx; 3menu0bind"
alias 3menu0bind "bind 1 13; bind 2 23; bind 3 33; bind 6 anuluj"
alias 13 "say_team Mam QUAD'a!; cancel"
alias 23 "say_team Q- RL needed; cancel"
alias 33 "say_team Q- Health needed; cancel"

alias 4menu0 "Echo [low] <1>H/A <2>Chain <3>RL <4>Rail <6>xx; 4menu0bind"
alias 4menu0bind "bind 1 14; bind 2 24; bind 3 34; bind 4 44; bind 6 anuluj"
alias 14 "say_team Health/armor needed; cancel"
alias 24 "say_team Chain/ammo needed; cancel"
alias 34 "say_team RL/Rockets needed; drop tech; cancel"
alias 44 "say_team RG/Slugs needed; cancel"

alias anuluj "echo [Anulowane]; cancel"
alias cancel "bind 1 1menu0; bind 2 2menu0; bind 3 3menu0; bind 4 4menu0"

bind 1 "1menu0"
bind 2 "2menu0"
bind 3 "3menu0"
bind 4 "4menu0"
bind 6 "anuluj"

play cfg/s_allmods